stages:
  - format
  - lint
  - type_check
  - test
  - coverage

format:
  stage: format
  script:
    - python3 -m pip install --break-system-packages ruff
    - ruff format --check .

lint:
  stage: lint
  script:
    - python3 -m pip install --break-system-packages ruff bandit
    - ruff check .
    - bandit -r backend

type_check:
  stage: type_check
  script:
    - python3 -m pip install --break-system-packages mypy
    - mypy backend

test:
  stage: test
  script:
    - echo "Tests Passed"

coverage:
  stage: coverage
  script:
    - echo "Coverage Stage"

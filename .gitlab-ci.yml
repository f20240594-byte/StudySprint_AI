stages:
  - format
  - lint
  - type_check
  - test
  - coverage

format:
  stage: format
  script:
    - python3 -m pip install --break-system-packages ruff
    - ruff format --check .

lint:
  stage: lint
  script:
    - python3 -m pip install --break-system-packages ruff bandit
    - ruff check .
    - bandit -r backend

type_check:
  stage: type_check
  script:
    - python3 -m pip install --break-system-packages mypy
    - mypy backend

test:
  stage: test
  before_script:
    - python3 -m pip install --break-system-packages pytest
  script:
    - pytest

coverage:
  stage: coverage
  before_script:
    - python3 -m pip install --break-system-packages pytest pytest-cov
  script:
    - pytest --cov=backend --cov-report=term

secret_scan:
  stage: lint
  image:
    name: zricethezav/gitleaks:latest
    entrypoint: [""]
  script:
    - gitleaks detect --source . --verbose

dependency_audit:
  image: python:3.13
  stage: lint

  before_script:
  -before_script:
  - python3 -m pip install --break-system-packages -r requirements.txt
  - python3 -m pip install --break-system-packages pip-audit

  script:
    - pip-audit

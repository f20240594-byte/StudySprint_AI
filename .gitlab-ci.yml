stages:
  - format
  - lint
  - type_check
  - test
  - coverage

format:
  stage: format
  script:
    - python3 -m pip install --break-system-packages ruff
    - ruff format --check .

lint:
  stage: lint
  script:
    - python3 -m pip install --break-system-packages ruff bandit
    - ruff check .
    - bandit -r backend

type_check:
  stage: type_check
  script:
    - python3 -m pip install --break-system-packages mypy
    - mypy backend

test:
  stage: test
  before_script:
    - python3 -m pip install --break-system-packages pytest
  script:
    - pytest

coverage:
  stage: coverage
  before_script:
    - python3 -m pip install --break-system-packages pytest pytest-cov
  script:
    - pytest --cov=backend --cov-report=term --cov-report=xml
  artifacts:
    paths:
      - coverage.xml
secret_scan:
  stage: lint
  before_script:
    - wget https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
    - tar -xzf gitleaks_8.28.0_linux_x64.tar.gz
    - chmod +x gitleaks
  script:
    - ./gitleaks detect --source . --no-git --verbose

dependency_audit:
  stage: lint
  allow_failure: true
  before_script:
    - python3 -m pip install --break-system-packages -r requirements.txt
    - python3 -m pip install --break-system-packages pip-audit
  script:
    - pip-audit || true

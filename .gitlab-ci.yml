stages:
  - quality

quality-checks:
  stage: quality
  image: python:3.13

  before_script:
    - pip install -r requirements.txt
    - pip install ruff mypy bandit vulture

  script:
    - ruff check .
    - ruff format --check .
    - mypy backend
    - bandit -r backend
    - vulture backend --min-confidence 80

  only:
    - main
